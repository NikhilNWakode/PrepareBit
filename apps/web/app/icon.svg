<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!--
    The browser-tab mark, from components/ui/logo.tsx.

    Two deliberate differences, because 16 pixels on an unknown tab colour is a
    different medium from an 18-pixel glyph in our own header: it sits on a
    filled tile so a hairline never has to survive on its own, and the open bit
    is drawn solid, since a 1px ring at this size turns to mush.
  -->
  <rect width="24" height="24" rx="5" fill="#2f5d50" />
  <g transform="translate(3.2 3.2) scale(0.735)">
    <rect x="3" y="3" width="3.4" height="18" rx="1.5" fill="#ffffff" />
    <path
      d="M6.4 4.7h6.9a4.3 4.3 0 0 1 0 8.6H6.4"
      stroke="#ffffff"
      stroke-width="3.4"
      stroke-linecap="square"
    />
    <rect x="10.2" y="16.9" width="4.2" height="4.2" rx="1.3" fill="#ffffff" />
  </g>
</svg>
